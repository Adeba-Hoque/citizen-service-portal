{% extends "base.html" %}

{% block title %}Administrator Login{% endblock %}

{% block content %}

<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-lg-5">

        <div class="card shadow-sm border-0">

            <div class="card-body p-5">

                <div class="text-center mb-4">

                    <h2 class="fw-bold">
                        Administrator Login
                    </h2>

                    <p class="text-muted">
                        Sign in to manage citizen service requests.
                    </p>

                </div>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control form-control-lg"
                            required
                        >

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control form-control-lg"
                            required
                        >

                    </div>

                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg"
                        >
                            Login
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>
</div>

{% endblock %}
